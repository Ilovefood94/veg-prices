<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>菜價看板｜今日果菜行情</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#EDF2EA;--surface:#FFFFFF;--ink:#13261C;--mute:#5B6E62;--leaf:#2F6B3F;--beet:#B8325A;--citrus:#F0C419;--line:#C9D6C6;--chip:#DDE8DA;--onleaf:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A14;--surface:#172A1F;--ink:#E8F0E9;--mute:#9BB0A2;--leaf:#6FCF8A;--beet:#FF7A9E;--line:#2B4234;--chip:#213629;--onleaf:#0F1A14;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:.02em}
.date{color:var(--mute);margin:2px 0 0}
.note{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--citrus);background:var(--surface);font-size:14px;color:var(--mute)}
.tags{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:22px 0 8px}
.tag{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:6px 28px 6px 28px;padding:18px 18px 16px 44px}
.tag::before{content:"";position:absolute;left:16px;top:20px;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.tag .k{font-size:14px;font-weight:700;color:var(--leaf)}
.tag .n{font-size:26px;font-weight:900;line-height:1.2;margin:2px 0}
.tag .p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tag .p small{font-size:13px;color:var(--mute);font-weight:400}
.tag .why{font-size:14px;color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px;margin:26px 0 14px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:700;padding:10px 14px;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--leaf)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input,.tools select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.tools input{flex:1 1 140px}
.chips{display:flex;gap:6px}
.chips button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--onleaf)}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.nm{font-weight:700}
.meta{font-size:13px;color:var(--mute)}
.in{display:inline-block;background:var(--citrus);color:#13261C;font-size:12px;font-weight:700;padding:0 7px;border-radius:4px;margin-left:6px}
.pr{text-align:right;font-variant-numeric:tabular-nums}
.pr b{font-size:20px}
.pr small{display:block;font-size:13px}
.dn{color:var(--leaf)}.up{color:var(--beet)}
.heart{width:44px;height:44px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute);border-radius:50%}
.heart[aria-pressed="true"]{color:var(--beet)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--citrus);outline-offset:2px}
.empty{padding:28px 8px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<main>
  <h1>菜價看板</h1>
  <p class="date" id="date">讀取中…</p>
  <p class="note">價格為農產品批發市場的交易行情（元／公斤），不是零售價。每天更新一次；休市日會顯示最近一個有交易的日期。</p>

  <section class="tags" aria-label="推薦">
    <div class="tag" id="tagDay"></div>
    <div class="tag" id="tagWeek"></div>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="prices">今日行情</button>
    <button role="tab" aria-selected="false" data-tab="favs" id="favTab">我最愛吃</button>
    <button role="tab" aria-selected="false" data-tab="season">當季推薦</button>
  </div>

  <div class="tools" id="tools">
    <input id="q" type="search" placeholder="搜尋果菜名稱" aria-label="搜尋果菜名稱">
    <div class="chips" id="cats">
      <button data-c="all" aria-pressed="true">全部</button>
      <button data-c="v" aria-pressed="false">蔬菜</button>
      <button data-c="f" aria-pressed="false">水果</button>
    </div>
    <select id="sort" aria-label="排序">
      <option value="name">依名稱</option>
      <option value="low">價格低到高</option>
      <option value="drop">跌幅最大</option>
    </select>
  </div>

  <ul id="list"></ul>
</main>

<script>
const R=(a,b)=>{const m=[];let x=a;for(;;){m.push(x);if(x===b)break;x=x%12+1}return m};
// 產季表是我依常見資料整理的近似值，可自行增修。比對方式：品名「包含」關鍵字，由上到下取第一個符合的。
const SEASON=[["胡蘿蔔",[11,4]],["蘿蔔",[11,3]],["洋蔥",[12,4]],["蔥",[10,3]],["甘藍",[11,4]],["結球白菜",[11,3]],
["青花菜",[11,3]],["花椰菜",[11,3]],["菠菜",[11,3]],["茼蒿",[11,3]],["芹菜",[11,3]],["甘藷葉",[1,12]],["蕹菜",[4,10]],
["馬鈴薯",[11,4]],["番茄",[11,5]],["茄子",[4,11]],["胡瓜",[3,11]],["絲瓜",[4,10]],["椪柑",[11,1]],["桶柑",[1,3]],
["柳橙",[11,2]],["柿",[10,12]],["蓮霧",[11,5]],["番石榴",[1,12]],["香蕉",[1,12]],["木瓜",[1,12]],["番荔枝",[7,2]],
["檸檬",[9,12]],["草莓",[12,3]],["鳳梨",[3,7]],["西瓜",[4,9]],["文旦",[8,10]]];
// 官方品名 → 常見名稱
const ALIAS={"甘藍":"高麗菜","結球白菜":"大白菜","甘藷葉":"地瓜葉","蕹菜":"空心菜","胡瓜":"小黃瓜","番石榴":"芭樂","番荔枝":"釋迦","蔥":"青蔥","蘿蔔":"白蘿蔔"};

const now=new Date(), month=now.getMonth()+1;
const dayNo=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5), weekNo=Math.floor(dayNo/7);
const $=s=>document.querySelector(s);
let ITEMS=[];
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("favs",JSON.stringify([...favs]))}catch(e){}};
const st={tab:"prices",cat:"all",q:"",sort:"name"};

function prep(x){
  const [base,...rest]=x.n.split("-"), variant=rest.join("-");
  const main=ALIAS[base]||base;
  const hit=SEASON.find(s=>x.n.includes(s[0]));
  return {...x,title:main+(variant?`（${variant}）`:""),official:ALIAS[base]?x.n:"",
    season:hit?R(hit[1][0],hit[1][1]).includes(month):null,
    chg:x.a?(x.p-x.a)/x.a:null};
}
const pct=x=>Math.round(Math.abs(x.chg)*100);

function why(x){
  const s=x.season===true?"當季，":x.season===false?"非產季，":"";
  if(x.chg===null)return s+"近期價格資料不足";
  if(x.chg<-0.02)return `${s}比近一週均價低 ${pct(x)}%`;
  if(x.chg>0.02)return `${s}比近一週均價高 ${pct(x)}%`;
  return `${s}價格與近一週持平`;
}
function tag(el,label,x){
  if(!x){el.innerHTML=`<div class="k">${label}</div><div class="why">資料不足，暫無推薦</div>`;return}
  el.innerHTML=`<div class="k">${label}</div><div class="n">${x.title}</div>
  <div class="p">${x.p} <small>元／公斤</small></div><div class="why">${why(x)}</div>`;
}
function picks(){
  let pool=ITEMS.filter(x=>x.season===true&&x.chg!==null&&x.q>0).sort((a,b)=>a.chg-b.chg);
  if(pool.length<3)pool=ITEMS.filter(x=>x.chg!==null&&x.q>0).sort((a,b)=>a.chg-b.chg);
  const top=pool.slice(0,5);
  const day=top[dayNo%(top.length||1)];
  const rest=pool.filter(x=>x!==day);
  tag($("#tagDay"),"今日推薦",day);
  tag($("#tagWeek"),"本週推薦",rest[weekNo%(rest.length||1)]);
}

function row(x){
  const on=favs.has(x.n);
  const arrow=x.chg===null?"":x.chg<-0.02?`<span class="dn">▼ ${pct(x)}%</span>`:x.chg>0.02?`<span class="up">▲ ${pct(x)}%</span>`:`<span class="meta">持平</span>`;
  return `<li class="row"><div><div class="nm">${x.title}${x.season===true?'<span class="in">當季</span>':""}</div>
  <div class="meta">${x.c==="v"?"蔬菜":"水果"}${x.official?"・官方品名 "+x.official:""}</div></div>
  <div class="pr"><b>${x.p}</b> <span class="meta">元／公斤</span><small>${arrow}</small></div>
  <button class="heart" data-n="${x.n}" aria-pressed="${on}" aria-label="${on?"移出":"加入"}我最愛吃：${x.title}">${on?"♥":"♡"}</button></li>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===st.tab));
  $("#favTab").textContent=`我最愛吃（${favs.size}）`;
  $("#tools").style.display=st.tab==="season"?"none":"flex";
  let items=ITEMS.slice();
  if(st.tab==="favs")items=items.filter(x=>favs.has(x.n));
  if(st.tab==="season")items=items.filter(x=>x.season===true).sort((a,b)=>(a.chg??9)-(b.chg??9));
  else{
    if(st.cat!=="all")items=items.filter(x=>x.c===st.cat);
    if(st.q)items=items.filter(x=>x.title.includes(st.q)||x.n.includes(st.q));
    if(st.sort==="low")items.sort((a,b)=>a.p-b.p);
    else if(st.sort==="drop")items.sort((a,b)=>(a.chg??9)-(b.chg??9));
  }
  $("#list").innerHTML=items.length?items.map(row).join(""):
    `<li class="empty">${st.tab==="favs"&&!favs.size?"還沒有收藏。在「今日行情」點愛心，把常買的果菜加進來。":"找不到符合的果菜。"}</li>`;
}

document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){st.tab=b.dataset.tab;render()}});
$("#cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.cat=b.dataset.c;
  document.querySelectorAll("#cats button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();render()});
$("#sort").addEventListener("change",e=>{st.sort=e.target.value;render()});
$("#list").addEventListener("click",e=>{const b=e.target.closest(".heart");if(!b)return;
  const n=b.dataset.n;favs.has(n)?favs.delete(n):favs.add(n);saveFavs();render()});

fetch("data/latest.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  ITEMS=d.items.map(prep);
  const [y,m,dd]=d.date.split("-");
  $("#date").textContent=`行情日期：${y}年${+m}月${+dd}日`;
  picks();render();
}).catch(()=>{$("#date").textContent="目前讀不到行情資料，請稍後再試。"});
</script>
</body>
</html>
